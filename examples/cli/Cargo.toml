[package]
name = "cs705-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Native offline CS-705 command line tools"
publish = false

[workspace]

[[bin]]
name = "cs705"
path = "src/main.rs"

[dependencies]
cs705 = { path = "../.." }
clap = { version = "=4.6.7", features = ["derive"] }
serde_json = "=1.0.154"
serialport = { version = "=4.10.1", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.26.4", default-features = false, features = ["fs"] }
