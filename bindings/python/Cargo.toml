[package]
name = "cs705-python"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
autotests = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
cs705-core = { package = "cs705", path = "../.." }
pyo3 = { version = "=0.30.1", features = ["abi3t-py315"] }
