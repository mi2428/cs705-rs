name: Library

'on':
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - '.github/workflows/library.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting, Clippy, tests, and documentation
        run: make quality
