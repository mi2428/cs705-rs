name: Release

'on':
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: Check release inputs
        id: inputs
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          version=$(jq -er '.packages[] | select(.name == "cs705") | .version' <<< "$metadata")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo '::error::The release tag must match v<library package version>.'
            exit 1
          fi
          if ! jq -e '.packages[] | select(.name == "cs705") | .publish == null or (.publish | index("crates-io") != null)' <<< "$metadata" > /dev/null; then
            echo '::error::Enable crates.io publishing in the library Cargo.toml before releasing.'
            exit 1
          fi
          if ! jq -e '.packages[] | select(.name == "cs705") | .license != null or .license_file != null' <<< "$metadata" > /dev/null; then
            echo '::error::Set the library license or license-file before releasing.'
            exit 1
          fi
          target=$(rustc --version --verbose | sed -n 's/^host: //p')
          case "$target" in
            *-unknown-linux-gnu | *-unknown-linux-musl) ;;
            *) echo '::error::Release binaries require a native Linux Rust toolchain.'; exit 1 ;;
          esac
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: Check all three independent workspaces
        run: |
          for directory in . examples/cli examples/tui; do
            (
              cd "$directory"
              cargo fetch --locked
              make quality
            )
          done
      - name: Verify the crate package without publishing
        run: cargo publish --locked --dry-run --registry crates-io --package cs705
      - name: Build and package native Linux binaries
        env:
          TARGET: ${{ steps.inputs.outputs.target }}
        run: |
          cargo build --manifest-path examples/cli/Cargo.toml --offline --locked --release \
            --bin cs705 --target "$TARGET" --target-dir examples/cli/target
          cargo build --manifest-path examples/tui/Cargo.toml --offline --locked --release \
            --bin cs705-tui --target "$TARGET" --target-dir examples/tui/target
          assets="$RUNNER_TEMP/release-assets"
          mkdir "$assets"
          tar -czf "$assets/cs705-$RELEASE_TAG-$TARGET.tar.gz" \
            -C "examples/cli/target/$TARGET/release" cs705
          tar -czf "$assets/cs705-tui-$RELEASE_TAG-$TARGET.tar.gz" \
            -C "examples/tui/target/$TARGET/release" cs705-tui
          cd "$assets"
          sha256sum -- *.tar.gz > SHA256SUMS
      - name: Store verified release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      # The first crate version needs an API-token publish before OIDC can be configured.
      - name: Authenticate with crates.io Trusted Publishing
        uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - name: Publish the library only
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io --package cs705

  attach:
    needs: publish
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
      - name: Verify and attach assets without overwriting existing files
        working-directory: ${{ runner.temp }}/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check --strict SHA256SUMS
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -- *.tar.gz SHA256SUMS
