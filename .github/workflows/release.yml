name: Release

'on':
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: bindings/python/pyproject.toml
      - name: Create an isolated Python environment
        run: |
          venv="$RUNNER_TEMP/python-venv"
          python -m venv "$venv"
          printf '%s/bin\n' "$venv" >> "$GITHUB_PATH"
          {
            printf 'PYTHON=%s\nPYO3_PYTHON=%s\n' "$venv/bin/python" "$venv/bin/python"
            printf 'PYTHON_TARGET_DIR=%s\n' "$RUNNER_TEMP/python-target"
            printf 'LIBRARY_PATH=%s/lib%s\n' "$pythonLocation" "${LIBRARY_PATH:+:$LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
      - name: Check release inputs
        id: inputs
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          version=$(jq -er '.packages[] | select(.name == "cs705") | .version' <<< "$metadata")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo '::error::The release tag must match v<library package version>.'
            exit 1
          fi
          if ! jq -e '.packages[] | select(.name == "cs705") | .publish == null or (.publish | index("crates-io") != null)' <<< "$metadata" > /dev/null; then
            echo '::error::Enable crates.io publishing in the library Cargo.toml before releasing.'
            exit 1
          fi
          if ! jq -e '.packages[] | select(.name == "cs705") | .license != null or .license_file != null' <<< "$metadata" > /dev/null; then
            echo '::error::Set the library license or license-file before releasing.'
            exit 1
          fi
          target=$(rustc --version --verbose | sed -n 's/^host: //p')
          case "$target" in
            x86_64-unknown-linux-gnu) ;;
            *) echo '::error::Release assets require a native Linux x86_64 GNU toolchain.'; exit 1 ;;
          esac
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"
          "$PYTHON" - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          root = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          binding = tomllib.loads(Path("bindings/python/Cargo.toml").read_text())["package"]
          project = tomllib.loads(Path("bindings/python/pyproject.toml").read_text())["project"]
          assert root["version"] == binding["version"] == project["version"]
          assert os.environ["RELEASE_TAG"] == "v" + project["version"]
          assert project["name"] == "cs705"
          assert binding["publish"] is False
          PY
      - name: Install Python build and metadata tools
        run: |
          "$PYTHON" - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          requirements = tomllib.loads(Path("bindings/python/pyproject.toml").read_text())["build-system"]["requires"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements, "ziglang==0.15.2", "twine==7.0.0"])
          PY
      - name: Check all three independent workspaces
        run: |
          for directory in . examples/cli examples/tui; do
            (
              cd "$directory"
              cargo fetch --locked
              make quality
            )
          done
      - name: Verify the crate package without publishing
        run: cargo publish --locked --dry-run --registry crates-io --package cs705
      - name: Check native Python bindings
        run: |
          cargo fetch --locked --manifest-path bindings/python/Cargo.toml
          make quality TARGETS=python
      - name: Build and test the Linux wheel
        run: |
          cmp LICENSE-MIT bindings/python/LICENSE-MIT
          cmp LICENSE-APACHE bindings/python/LICENSE-APACHE
          "$PYTHON" -m maturin build --release --offline --locked --zig \
            --compatibility manylinux_2_28 --target x86_64-unknown-linux-gnu \
            --manifest-path bindings/python/Cargo.toml --interpreter "$PYTHON" \
            --target-dir "$PYTHON_TARGET_DIR" --out "$RUNNER_TEMP/python-dist"
          "$PYTHON" -m twine check --strict "$RUNNER_TEMP"/python-dist/*.whl
          "$PYTHON" -m pip install --no-deps "$RUNNER_TEMP"/python-dist/*.whl
          "$PYTHON" -I -c 'import cs705; print(cs705.__file__)'
          make test TARGETS=python TESTS=wheel
      - name: Store verified Python distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Build and package native Linux binaries
        env:
          TARGET: ${{ steps.inputs.outputs.target }}
        run: |
          cargo build --manifest-path examples/cli/Cargo.toml --offline --locked --release \
            --bin cs705 --target "$TARGET" --target-dir examples/cli/target
          cargo build --manifest-path examples/tui/Cargo.toml --offline --locked --release \
            --bin cs705-tui --target "$TARGET" --target-dir examples/tui/target
          assets="$RUNNER_TEMP/release-assets"
          mkdir "$assets"
          tar -czf "$assets/cs705-$RELEASE_TAG-$TARGET.tar.gz" \
            -C "examples/cli/target/$TARGET/release" cs705
          tar -czf "$assets/cs705-tui-$RELEASE_TAG-$TARGET.tar.gz" \
            -C "examples/tui/target/$TARGET/release" cs705-tui
          cp "$RUNNER_TEMP"/python-dist/*.whl "$assets/"
          cd "$assets"
          sha256sum -- *.tar.gz *.whl > SHA256SUMS
      - name: Store verified release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: Publish the library only
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo '::error::CARGO_REGISTRY_TOKEN is required.'; exit 1; }
          cargo publish --locked --registry crates-io --package cs705

  publish-python:
    needs: [build, publish]
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/cs705
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Publish Python distributions with Trusted Publishing
        run: |
          venv="$RUNNER_TEMP/publish-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install 'uv==0.13.0'
          "$venv/bin/uv" publish --no-config --trusted-publishing always \
            --publish-url https://upload.pypi.org/legacy/ dist/*.whl

  attach:
    needs: publish-python
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
      - name: Verify and attach assets without overwriting existing files
        working-directory: ${{ runner.temp }}/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check --strict SHA256SUMS
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -- *.tar.gz *.whl SHA256SUMS
